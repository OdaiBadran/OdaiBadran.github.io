try{let saved=JSON.parse(localStorage.getItem(KEY));if(saved?.version===1){state={...state,...saved};if(!Array.isArray(state.pantry)||!Array.isArray(state.stock)||!Array.isArray(state.custom)||!Array.isArray(state.favorite)||typeof state.plans!=='object'||!state.plans||!state.checks||typeof state.checks!=='object')state=defaults();state.family=Math.min(12,Math.max(1,Number(state.family)||4));}}catch(e){saveFailed=true}
let weekKey=sunday(today),currentPage='week',recipeFilter='all',recipeQuery='',dialogContext=null,toastTimer,lastFocus,shelfQuery='',activeDrag=null;
state.categories=Array.isArray(state.categories)?state.categories:[];
state.restaurants=Array.isArray(state.restaurants)?state.restaurants:[];
const recipes=()=>[...RECIPES,...state.custom];
const getRecipe=id=>recipes().find(r=>r.id===id);
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));saveFailed=false;$('#save-label').textContent='محفوظ على هذا الجهاز'}catch(e){saveFailed=true;$('#save-label').textContent='تعذّر الحفظ على هذا الجهاز';toast('التخزين غير متاح. صدّري نسخة احتياطية من التفضيلات.')}}
function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),3300)}
function allowed(r){if(!r)return false;const tags=r.tags||[];if(state.diet==='vegetarian'&&(tags.includes('meat')||tags.includes('fish')))return false;if(state.diet==='noFish'&&tags.includes('fish'))return false;return !state.avoid.split(/[,،\n]/).map(x=>x.trim()).filter(Boolean).some(x=>r.name.includes(x)||r.ing.some(i=>i.n.includes(x)))}
function pantryMatch(r){return r.ing.filter(i=>state.pantry.includes(i.n)).length}
function candidates(cat,time=999){return recipes().filter(r=>allowed(r)&&(!cat||r.cat===cat)&&r.time<=time).sort((a,b)=>(pantryMatch(b)-pantryMatch(a))*3+(state.favorite.includes(b.id)?2:0)-(state.favorite.includes(a.id)?2:0))}

const BASE_CATEGORIES=[{id:'quick',name:'طبخات سريعة',mode:'quick'},{id:'cook',name:'طبخات ثقيلة',mode:'cook'},{id:'restaurants',name:'مطاعم',mode:'buy'}];
const categories=()=>[...BASE_CATEGORIES,...state.categories];
const categoryByID=id=>categories().find(c=>c.id===id);
const recipeCategory=r=>r.category||r.cat;
const getRestaurant=id=>state.restaurants.find(r=>r.id===id);
const entryToken=(kind,id)=>`${kind}:${id}`;
function entryFromToken(token){
 if(typeof token!=='string'||token.length>150)return null;
 const [kind,id,...extra]=token.split(':');if(extra.length)return null;
 if(kind==='recipe'){const r=getRecipe(id);return r?{kind,id,name:r.name,time:r.time,allowed:allowed(r),entry:r}:null}
 if(kind==='restaurant'){const r=getRestaurant(id);return r?{kind,id,name:r.name,time:0,allowed:state.allowBuy,entry:r}:null}
 if(kind==='buy'&&['near','far'].includes(id))return {kind,id,name:id==='near'?'مطعم قريب':'مطاعم بمنطقة أوسع',time:0,allowed:state.allowBuy};
 return null;
}
function categoryEntries(cat){
 if(cat.mode==='buy')return [...(cat.id==='restaurants'?['near','far'].map(area=>entryFromToken(entryToken('buy',area))):[]),...state.restaurants.filter(r=>r.category===cat.id).map(r=>entryFromToken(entryToken('restaurant',r.id)))];
 return recipes().filter(r=>recipeCategory(r)===cat.id).map(r=>entryFromToken(entryToken('recipe',r.id)));
}
function shelfGroups(){
 let found=0;
 const markup=categories().map(cat=>{
  const all=categoryEntries(cat),list=all.filter(e=>e.name.includes(shelfQuery));found+=list.length;
  if(shelfQuery&&!list.length&&!cat.name.includes(shelfQuery))return '';
  return `<details class="meal-group" data-shelf-category="${ESC(cat.id)}" open><summary>${icon(cat.mode==='buy'?'store':cat.mode==='quick'?'lightning':'pot')}${ESC(cat.name)}<span class="group-count">${num(list.length)}</span></summary><div>${list.map(e=>{const token=entryToken(e.kind,e.id),custom=e.kind==='restaurant'||e.entry?.id.startsWith('custom-');return `<div class="shelf-entry ${e.allowed?'':'is-excluded'}" draggable="${e.allowed}" data-drag-meal="${ESC(token)}"><button class="shelf-meal" type="button" data-shelf-meal="${ESC(token)}" ${e.allowed?'':'disabled'} aria-label="${ESC(e.name)} — ${e.allowed?'اسحبيها إلى يوم أو اضغطي لاختيار يوم':'خارج التفضيلات الحالية'}"><span class="grip" aria-hidden="true">⠿</span><span class="shelf-thumb">${icon(e.kind==='recipe'?cat.mode==='quick'?'lightning':'pot':'store')}</span><span><strong>${ESC(e.name)}</strong><small>${!e.allowed?'خارج التفضيلات الحالية':e.kind==='recipe'?`${num(e.time)} دقيقة`:e.kind==='buy'?'بحث في المطاعم':'مطعم / طلب محفوظ'}</small></span></button>${custom?`<button class="shelf-edit" type="button" data-edit-entry="${ESC(token)}" aria-label="تعديل ${ESC(e.name)}">${icon('edit')}</button>`:''}</div>`}).join('')||'<p class="shelf-none">أضيفي أول وجبة لهذا التصنيف.</p>'}</div><div class="group-actions"><button class="group-add" data-add-meal="${ESC(cat.id)}">${icon('plus')}${cat.mode==='buy'?'أضيفي مطعمًا أو طلبًا':'أضيفي وجبة'}</button></div></details>`;
 }).join('');
 return markup||(shelfQuery&&!found?'<p class="shelf-none">ما لقينا وجبة بهذا الاسم. جرّبي كلمة ثانية.</p>':'');
}
function renderMealShelf(){return `<aside class="meal-shelf" aria-label="قائمة الوجبات للسحب إلى الجدول"><div class="shelf-heading">${icon('book')}<h3>اختاري، اسحبي، وارتاحي.</h3></div><p class="shelf-caption">اسحبي الوجبة إلى أي يوم، أو اضغطي عليها لاختيار اليوم.</p><div class="shelf-tools"><button class="button primary" data-add-meal="quick">${icon('plus')}وجبة جديدة</button><button class="button outline" data-action="add-category">${icon('plus')}تصنيف جديد</button></div><div class="search shelf-search">${icon('search')}<input class="field" type="search" id="shelf-search" aria-label="ابحثي في قائمة الوجبات" placeholder="ابحثي عن طبخة…" value="${ESC(shelfQuery)}"></div><div class="shelf-groups" id="shelf-groups">${shelfGroups()}</div></aside>`}
function assignmentMessage(token,i){
 const e=entryFromToken(token);if(!e||!Number.isInteger(i)||i<0||i>6)return 'هذه الوجبة أو اليوم غير متاح.';
 if(!e.allowed)return e.kind==='recipe'?'هذه الطبخة مستثناة من تفضيلات عائلتك.':'الطلب من الخارج مستثنى في تفضيلاتك.';
 return '';
}
function applyAssignment(token,i,extendTime=false){
 const error=assignmentMessage(token,i);if(error){toast(error);return false}
 const e=entryFromToken(token),d=plan()[i];if(e.kind==='recipe'&&e.time>d.time&&!extendTime)return false;
 if(extendTime&&e.kind==='recipe')d.time=Math.max(d.time,e.time);
 const old=d.meal;
 d.meal=e.kind==='recipe'?{type:'recipe',id:e.id}:e.kind==='restaurant'?{type:'buy',area:e.entry.area||'near',restaurant:e.id}:{type:'buy',area:e.id};
 if(!(e.kind==='recipe'&&old?.type==='recipe'&&old.id===e.id))d.batch=false;
 repair();render();toast(`أضفنا ${e.name} ليوم ${DAYS[i]}، وتحدّثت المشتريات.`);return true;
}
function requestAssignment(token,i){

function safeLink(value){if(!value)return '';try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)?u.href:''}catch(e){return ''}}
function registerCategory(name,mode){
 name=String(name||'').trim().replace(/\s+/g,' ');if(!name||name.length>45)return {error:'اكتبي اسم تصنيف من حرف إلى ٤٥ حرفًا.'};
 if(!['quick','cook','buy'].includes(mode))return {error:'اختاري نوع التصنيف.'};
 if(categories().some(c=>c.name===name))return {error:'هذا التصنيف موجود بالفعل. اختاري اسمًا آخر.'};
 if(state.categories.length>=50)return {error:'وصلتِ إلى الحد الأقصى: ٥٠ تصنيفًا إضافيًا.'};
 const category={id:'category-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),name,mode};state.categories.push(category);save();return {category};
}

(v)?'checked':''}>${t}</label>`).join('')}</div><p class="hint">حدّدي المكونات الرئيسية ليُراعى نمط الأكل عند اقتراح الوجبة.</p><label class="check-line"><input type="checkbox" name="freezer" ${r.freezer?'checked':''}>مناسبة للتحضير المسبق</label></div><div id="meal-buy-fields" ${isBuy?'':'hidden'}><label class="label" for="meal-url">رابط المطعم أو الطلب (اختياري)</label><input class="field" id="meal-url" name="url" type="url" dir="ltr" placeholder="https://…" maxlength="1500" value="${ESC(r.url||'')}" ${isBuy?'':'disabled'}><label class="label" for="meal-area">منطقة الطلب</label><select class="field" id="meal-area" name="area"><option value="near" ${r.area!=='far'?'selected':''}>قريب</option><option value="far" ${r.area==='far'?'selected':''}>منطقة أوسع</option></select></div><label class="label" for="meal-notes">ملاحظات (اختياري)</label><textarea class="field" id="meal-notes" name="notes" maxlength="500" placeholder="طلبنا المعتاد، طبق جانبي، أو تذكير صغير…">${ESC(r.notes||'')}</textarea><p id="meal-error" role="alert" class="hint" style="color:#a65839"></p><div class="modal-foot"><button class="button primary" type="submit">${icon('check')}${existing?'حفظ التعديلات':'إضافة الوجبة'}</button><button class="button outline" type="button" data-action="close">رجوع</button></div></form>`)

function registerMeal(values,editToken=''){
 const category=categoryByID(values.category),name=String(values.name||'').trim(),existing=entryFromToken(editToken);
 if(!category||!name||name.length>70)return {error:'راجعي اسم الوجبة والتصنيف.'};
 if(existing&&((existing.kind==='restaurant')!==(category.mode==='buy')))return {error:'اختاري تصنيفًا من نوع الوجبة نفسه.'};
 if(!existing&&state.custom.length+state.restaurants.length>=200)return {error:'وصلتِ إلى الحد الأقصى: ٢٠٠ وجبة شخصية.'};
 let entry,token;
 if(category.mode==='buy'){
  const url=String(values.url||'').trim();if(url&&!safeLink(url))return {error:'الرابط يجب أن يبدأ بـ https:// أو http://.'};
  entry={id:existing?.id||'restaurant-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),name,category:category.id,url:safeLink(url),area:values.area==='far'?'far':'near',notes:String(values.notes||'').slice(0,500)};
  if(existing){const i=state.restaurants.findIndex(r=>r.id===existing.id);state.restaurants[i]=entry}else state.restaurants.push(entry);token=entryToken('restaurant',entry.id);
 }else{
  const time=Number(values.time);if(!Number.isFinite(time)||time<5||time>300)return {error:'وقت الطبخ بين ٥ و٣٠٠ دقيقة.'};
  const units=Object.fromEntries(Object.entries(UNITS).map(([k,v])=>[v,k]));
  const ingredients=String(values.ingredients||'').split('\n').filter(s=>s.trim()).map(line=>{let [n,q,u]=line.split('|').map(s=>s.trim());q=String(q||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));return {n,q:Number(q),u:units[u]||u,g:recipes().flatMap(r=>r.ing).find(i=>i.n===n)?.g||'other'}});
  if(ingredients.length>80||ingredients.some(i=>!i.n||i.n.length>99||!Number.isFinite(i.q)||i.q<=0||i.q>1000000||!Object.hasOwn(UNITS,i.u)))return {error:'راجعي المقادير: الاسم | رقم موجب | الوحدة. مثال: رز | 300 | غ'};
  const text=name+' '+ingredients.map(i=>i.n).join(' '),tags=new Set(values.tags||[]);
  if(/لحم|دجاج|برجيت/.test(text))tags.add('meat');if(/سمك|سلمون|دينيس/.test(text))tags.add('fish');
  entry={id:existing?.id||'custom-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),name,cat:category.mode,category:category.id,time,ing:ingredients,steps:String(values.steps||'').split('\n').map(s=>s.trim()).filter(Boolean),tags:[...tags],art:existing?.entry?.art||'rice',freezer:!!values.freezer,notes:String(values.notes||'').slice(0,500)};
  if(existing){const i=state.custom.findIndex(r=>r.id===existing.id);if(i<0)return {error:'هذه وصفة أساسية. أضيفي نسخة شخصية منها.'};state.custom[i]=entry}else state.custom.push(entry);token=entryToken('recipe',entry.id);
 }
 repair();save();return {entry,token};
}

 showModal(ESC(r.name),ESC(categoryByID(r.category)?.name||'مطاعم'),`<div class="recipe-detail-art">${food(r.area==='far'?'far':'buy')}</div><p class="entry-note">${ESC(r.notes||'طلب خارجي محفوظ في قائمتك.')}</p><div class="modal-foot">${url?`<a class="button primary" href="${ESC(url)}" target="_blank" rel="noopener noreferrer">${icon('external')}افتحي رابط المطعم</a>`:''}<button class="button outline" data-edit-entry="${ESC(entryToken('restaurant',r.id))}">${icon('edit')}تعديل المطعم</button></div><p class="hint">أنتِ تراجعين الطلب والأسعار والتوصيل مباشرةً مع المطعم.</p>`)

function clearDrag(){activeDrag=null;document.body.classList.remove('meal-dragging');$$('.drag-over,.is-dragging').forEach(el=>el.classList.remove('drag-over','is-dragging'))}

function freshDays(){return ['heavy','medium','easy','heavy','medium','easy','heavy'].map((load,i)=>({load,time:LOADS[load].time,note:'',meal:null,batch:false}))}
function plan(){if(!state.plans[weekKey]){state.plans[weekKey]=freshDays();generate(false,true);save()}return state.plans[weekKey]}
function fallback(d,used,index){let pool=candidates(d.load==='easy'?'cook':'quick',d.time);if(!pool.length)pool=candidates(null,d.time);let fresh=pool.filter(r=>!used.has(r.id));let chosen=(fresh.length?fresh:pool)[index%(fresh.length||pool.length||1)];return chosen?{type:'recipe',id:chosen.id}:null}
function generate(notify=true,initial=false){
 const days=state.plans[weekKey]||freshDays(),used=new Set(),stockUsed=new Set();
 days.forEach(d=>{d.meal=null;d.batch=false});
 const initialIDs=['','tortilla','maqluba','','lentils','rizlaban',''];
 days.forEach((d,i)=>{
  if(d.load==='heavy'){
   const src=days.findIndex((s,j)=>d.time>=10&&j<i&&i-j<=2&&s.batch&&s.meal?.type==='recipe'&&!days.some(p=>p.meal?.type==='leftover'&&p.meal.source===j));
   if(src>=0){d.meal={type:'leftover',id:days[src].meal.id,source:src};return}
   const stock=state.stock.find(s=>d.time>=10&&s.portions>=state.family&&!stockUsed.has(s.id)&&getRecipe(s.recipe)&&allowed(getRecipe(s.recipe)));
   if(stock){stockUsed.add(stock.id);d.meal={type:'stock',id:stock.recipe,stock:stock.id};return}
   if(state.allowBuy&&(i===0||i===6||!candidates('quick',d.time).length)){d.meal={type:'buy',area:i===6?'far':'near'};return}
  }
  const preferred=initial&&initialIDs[i]&&getRecipe(initialIDs[i]);
  d.meal=preferred&&allowed(preferred)&&preferred.time<=d.time?{type:'recipe',id:preferred.id}:fallback(d,used,i+Math.floor(Math.random()*3));
  if(d.meal){used.add(d.meal.id);d.batch=d.load==='easy'&&!!getRecipe(d.meal.id)?.freezer&&days.some((n,j)=>j>i&&j-i<=2&&n.load==='heavy')&&!(initial&&i===5)}
 });state.plans[weekKey]=days;save();if(notify){render();toast('خطة جديدة على قدّ وقتك جاهزة!')}
}

 showModal(`شو بتحبّي ناكل ${DAYS[i]}؟`,`${LOADS[d.load].label} · ${num(d.time)} دقيقة متاحة`, `<div class="chips">${[['quick','طبخ سريع'],['cook','طبخ'],['buy','شراء'],['ready','جاهزة من قبل']].map(([id,t])=>`<button class="chip ${cat===id?'active':''}" data-choose-cat="${id}" aria-pressed="${cat===id}">${t}</button>`).join('')}</div><div class="chooser-list">${options}</div><button class="button ghost" data-action="edit-day" data-i="${i}">${icon('clock')}تعديل الوقت المتاح</button>`)

function tomorrowReminder(){let next=addDate(iso(today),1),key=sunday(next),days=state.plans[key],i=next.getDay();if(!days)return 'حضّري خطة الأسبوع القادم، ووفّري حيرة بكرا.';let d=days[i],m=mealInfo(d,i);if(d.meal?.type==='leftover')return `وجبة بكرا جاهزة: ${m.title} من طبخة ${DAYS[d.meal.source]}.`;if(d.meal?.type==='stock')return `راجعي وجبة ${m.title} المحفوظة، وخطّطي لتجهيزها للغد.`;if(d.meal?.type==='buy')return 'بكرا يوم طلب. اختاري المطعم اللي بيريّحك.';return `طبخة بكرا: ${m.title}. راجعي المكونات وجهّزي اللي بتقدري عليه.`}

function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function calendarReminder(){const field=$('#reminder-time');if(field?.value){state.reminderTime=field.value;save()}let parts=state.reminderTime.split(':'),d=new Date(today);d.setHours(+parts[0],+parts[1],0,0);if(d<new Date())d=new Date(Date.now()+60000);let end=new Date(d.getTime()+15*60000),utc=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');let text=reminderText().replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');const data=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Tabkhti//Meal Planner//AR','CALSCALE:GREGORIAN','BEGIN:VEVENT',`UID:tabkhti-${Date.now()}@local`,`DTSTAMP:${utc(new Date())}`,`DTSTART:${utc(d)}`,`DTEND:${utc(end)}`,'SUMMARY:حضّري طبخة بكرا',`DESCRIPTION:${text}`,'BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:وقت تحضير وجبة الغد','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');download(new Blob([data],{type:'text/calendar;charset=utf-8'}),'tabkhti-reminder.ics');toast('افتحي الملف وأضيفيه لتقويمك لتفعيل التنبيه.')}
async function copyShopping(){let text=`مشتريات طبختي — ${weekRange()}\n${shopping().map(x=>`${state.checks[checkedKey(x)]?'✓':'☐'} ${x.n}: ${quantity(x.q,x.u)}`).join('\n')}`;try{await navigator.clipboard.writeText(text);toast('نُسخت القائمة. أرسليها أو احتفظي بها.')}catch(e){showModal('قائمة جاهزة للنسخ','حدّدي النص وانسخيه.',`<textarea class="field" rows="14" readonly>${ESC(text)}</textarea>`);$('textarea',$('#modal')).select()}}
function validImport(x){
 if(!x||x.version!==1||!Number.isInteger(x.family)||x.family<1||x.family>12||!['all','vegetarian','noFish'].includes(x.diet)||typeof x.avoid!=='string'||x.avoid.length>500||typeof x.allowBuy!=='boolean'||!Array.isArray(x.custom)||x.custom.length>200||!Array.isArray(x.pantry)||!Array.isArray(x.stock)||!Array.isArray(x.favorite)||!x.checks||typeof x.checks!=='object'||!x.plans||typeof x.plans!=='object')return false;
 if(!x.pantry.every(n=>typeof n==='string'&&n.length<100)||x.pantry.length>300||!x.favorite.every(n=>typeof n==='string'))return false;
 if(!x.custom.every(r=>r&&typeof r.id==='string'&&/^custom-[\w-]+$/.test(r.id)&&typeof r.name==='string'&&r.name.length<=70&&['quick','cook'].includes(r.cat)&&Number.isFinite(r.time)&&r.time>=5&&r.time<=300&&Array.isArray(r.ing)&&r.ing.length<=80&&r.ing.every(i=>typeof i.n==='string'&&i.n.length<100&&Number.isFinite(i.q)&&i.q>0&&!!UNITS[i.u]&&!!GROUPS[i.g])&&Array.isArray(r.tags)&&r.tags.every(t=>['meat','fish','dairy','gluten','egg','vegan'].includes(t))&&Array.isArray(r.steps)&&r.steps.every(s=>typeof s==='string'&&s.length<6001)))return false;
 const savedCategories=x.categories||[],restaurants=x.restaurants||[];
 if(!Array.isArray(savedCategories)||savedCategories.length>50||!savedCategories.every(c=>c&&typeof c.id==='string'&&/^category-[\w-]+$/.test(c.id)&&typeof c.name==='string'&&c.name.trim().length>0&&c.name.length<=45&&['quick','cook','buy'].includes(c.mode)))return false;
 if(new Set(savedCategories.map(c=>c.id)).size!==savedCategories.length)return false;
 const catMap=new Map([...BASE_CATEGORIES,...savedCategories].map(c=>[c.id,c]));
 if(!x.custom.every(r=>!r.category||catMap.has(r.category)&&catMap.get(r.category).mode===r.cat))return false;
 if(!Array.isArray(restaurants)||restaurants.length>200||!restaurants.every(r=>r&&typeof r.id==='string'&&/^restaurant-[\w-]+$/.test(r.id)&&typeof r.name==='string'&&r.name.trim().length>0&&r.name.length<=70&&catMap.get(r.category)?.mode==='buy'&&['near','far'].includes(r.area)&&typeof r.url==='string'&&r.url.length<=1500&&(!r.url||!!safeLink(r.url))&&typeof r.notes==='string'&&r.notes.length<=500))return false;
 if(new Set([...x.custom,...restaurants].map(r=>r.id)).size!==x.custom.length+restaurants.length)return false;
 if(!x.custom.every(r=>r.notes===undefined||typeof r.notes==='string'&&r.notes.length<=500))return false;
 const ids=new Set([...RECIPES,...x.custom].map(r=>r.id));if(!x.stock.every(s=>s&&typeof s.id==='string'&&/^stock-[\w-]+$/.test(s.id)&&ids.has(s.recipe)&&Number.isInteger(s.portions)&&s.portions>0&&s.portions<=48&&['fridge','freezer'].includes(s.place)&&/^\d{4}-\d{2}-\d{2}$/.test(s.date)))return false;
 if(Object.entries(x.plans).length>200)return false;
 if(!Object.entries(x.plans).every(([k,v])=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&Array.isArray(v)&&v.length===7&&v.every(d=>d&&Object.hasOwn(LOADS,d.load)&&Number.isFinite(d.time)&&d.time>=5&&d.time<=300&&typeof d.note==='string'&&d.note.length<=100&&(!d.meal||(['recipe','leftover','stock','buy'].includes(d.meal.type)&&(d.meal.type==='buy'?['near','far'].includes(d.meal.area)&&(!d.meal.restaurant||restaurants.some(r=>r.id===d.meal.restaurant)):ids.has(d.meal.id))&&(d.meal.type!=='leftover'||Number.isInteger(d.meal.source)&&d.meal.source>=0&&d.meal.source<7)&&(d.meal.type!=='stock'||x.stock.some(s=>s.id===d.meal.stock)))))))return false;
 return [x.town,x.farTown].every(v=>typeof v==='string'&&v.length<=100)&&/^\d{2}:\d{2}$/.test(x.reminderTime||'18:00');
}

 if(b.dataset.pickRecipe){selectMeal({type:'recipe',id:b.dataset.pickRecipe});return}
 if(b.dataset.pickBuy){selectMeal({type:'buy',area:b.dataset.pickBuy});return}
 if(b.hasAttribute('data-pick-leftover')){let source=+b.dataset.pickLeftover;selectMeal({type:'leftover',id:plan()[source].meal.id,source});return}
 if(b.dataset.pickStock){let s=state.stock.find(s=>s.id===b.dataset.pickStock);selectMeal({type:'stock',id:s.recipe,stock:s.id});return}
 if(b.dataset.addToPlan){addToDay(b.dataset.addToPlan);return}
 if(b.hasAttribute('data-assign-day')){requestAssignment(entryToken('recipe',b.dataset.id),+b.dataset.assignDay);return}
 if(b.dataset.load){let form=$('#day-form');form.elements.load.value=b.dataset.load;form.elements.time.value=LOADS[b.dataset.load].time;$$('.load-option',form).forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',x===b)});return}
 if(b.hasAttribute('data-remove-pantry')){state.pantry.splice(+b.dataset.removePantry,1);save();render();return}
 if(b.dataset.removeStock){state.stock=state.stock.filter(s=>s.id!==b.dataset.removeStock);repair();render();toast('أُزيلت الوجبة وتحدّثت الخطة.');return}
 if(b.dataset.map){let area=b.dataset.map;if(!(area==='far'?state.farTown:state.town)){toast(area==='far'?'أضيفي منطقة البحث الأوسع واحفظيها أولًا.':'أضيفي بلدتك واحفظيها أولًا.');$(area==='far'?'[name=farTown]':'[name=town]')?.focus();return}window.open(mapURL(area),'_blank','noopener,noreferrer');return}
 const a=b.dataset.action,i=+b.dataset.i;
 if(a==='settings')settings();if(a==='close')closeModal();if(a==='schedule')editSchedule();if(a==='edit-day')editDay(i);if(a==='choose')choose(i);if(a==='add-recipe')addRecipe();if(a==='add-stock')addStock();if(a==='reminders')reminders();
 if(a==='meal-detail'){let d=plan()[i];if(!d.meal)return choose(i);if(d.meal.type==='buy'){if(d.meal.restaurant)restaurantDetail(d.meal.restaurant);else location.hash='order';return}dialogContext={i};recipeDetail(d.meal.id)}
 if(a==='regenerate')showModal('نرتّب الأسبوع من جديد؟','ستُستبدل وجبات هذا الأسبوع مع الإبقاء على جدول الدراسة.',`<p class="subtitle">نختار من الوصفات المناسبة لوقتك وتفضيلات عائلتك، ونقدّم الموجود في مطبخك.</p><div class="modal-foot"><button class="button primary" data-action="confirm-regenerate">${icon('spark')}رتّبي الخطة</button><button class="button outline" data-action="close">خليها مثل ما هي</button></div>`);
 if(a==='confirm-regenerate'){closeModal();generate()}
 if(a==='prev-week'||a==='next-week'){weekKey=iso(addDate(weekKey,a==='prev-week'?-7:7));repair();render()}
 if(a==='this-week'){weekKey=sunday(today);repair();render()}
 if(a==='print')window.print();if(a==='copy-shopping')copyShopping();if(a==='calendar-reminder')calendarReminder();
 if(a==='clear-checks'){shopping().forEach(x=>delete state.checks[checkedKey(x)]);save();render()}
 if(a==='export'){download(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),'tabkhti-backup.json');toast('نُزّلت نسخة احتياطية من بياناتك.')}
});
document.addEventListener('input',e=>{if(e.target.id==='shelf-search'){shelfQuery=e.target.value;$('#shelf-groups').innerHTML=shelfGroups();return}if(e.target.id==='recipe-search'){recipeQuery=e.target.value;let pos=e.target.selectionStart;render();let input=$('#recipe-search');input.focus();input.setSelectionRange(pos,pos)}});
document.addEventListener('change',async e=>{
 let t=e.target;if(t.id==='meal-category'){const mode=categoryByID(t.value)?.mode,isBuy=mode==='buy';$('#meal-cook-fields').hidden=isBuy;$('#meal-buy-fields').hidden=!isBuy;$('#meal-time').disabled=isBuy;$('#meal-time').required=!isBuy;$('#meal-url').disabled=!isBuy;if(!isBuy)$('#meal-time').value=mode==='cook'?60:25}
 if(t.dataset.shop){state.checks[weekKey+'|'+t.dataset.shop]=t.checked;save();render();let target=$$('[data-shop]').find(e=>e.dataset.shop===t.dataset.shop);target?.focus()}
 if(t.hasAttribute('data-schedule-load')){let i=t.dataset.scheduleLoad;$('#schedule-form').elements['time'+i].value=LOADS[t.value].time}
 if(t.id==='import-data'){let f=t.files[0];if(!f)return;if(f.size>1500000){toast('الملف أكبر من الحد المسموح.');return}try{let data=JSON.parse(await f.text());if(!validImport(data))throw Error();showModal('استعادة النسخة الاحتياطية؟','سيحلّ محتوى الملف محلّ البيانات الحالية على هذا الجهاز.',`<p class="subtitle">عائلة من ${num(data.family)} أفراد · ${num(Object.keys(data.plans).length)} خطط أسبوعية محفوظة.</p><div class="modal-foot"><button class="button primary" id="confirm-import">استعادة بياناتي</button><button class="button outline" data-action="close">إلغاء</button></div>`);$('#confirm-import').addEventListener('click',()=>{state={...defaults(),...data};repair();save();closeModal();render();toast('استعدنا بياناتك. أهلًا بخطتك!')},{once:true})}catch(err){toast('هذا الملف غير صالح لنسخة احتياطية من طبختي.')}}
});
document.addEventListener('submit',e=>{
 let f=e.target;if(!['meal-form','category-form','settings-form','schedule-form','day-form','pantry-form','locations-form','recipe-form','stock-form','reminder-form'].includes(f.id))return;e.preventDefault();let v=new FormData(f);
 if(f.id==='category-form'){const result=registerCategory(v.get('name'),v.get('mode'));if(result.error){$('#category-error').textContent=result.error;return}closeModal();render();addMeal(result.category.id);return}
 if(f.id==='meal-form'){const result=registerMeal({name:v.get('name'),category:v.get('category'),time:v.get('time'),ingredients:v.get('ingredients'),steps:v.get('steps'),tags:v.getAll('tag'),freezer:v.get('freezer')==='on',url:v.get('url'),area:v.get('area'),notes:v.get('notes')},f.dataset.edit);if(result.error){$('#meal-error').textContent=result.error;return}closeModal();render();toast('حُفظت الوجبة. اسحبيها إلى اليوم المناسب من قائمتك.');return}
 if(f.id==='settings-form'){state.family=+v.get('family');state.diet=v.get('diet');state.avoid=v.get('avoid').trim();state.allowBuy=v.get('allowBuy')==='on';repair();closeModal();render();toast('حُفظت التفضيلات وتحدّثت الخطة والمقادير.')}
 if(f.id==='schedule-form'){let days=plan();days.forEach((d,i)=>{d.load=v.get('load'+i);d.time=+v.get('time'+i);d.note=v.get('note'+i).trim()});closeModal();generate()}
 if(f.id==='day-form'){let d=plan()[+f.dataset.i];d.load=v.get('load');d.time=+v.get('time');d.note=v.get('note').trim();d.batch=v.get('batch')==='on'&&d.meal?.type==='recipe';repair();closeModal();render();toast('حُفظ يومك، وتحدّثت المشتريات.')}
 if(f.id==='pantry-form'){let input=$('#pantry-input'),raw=input.value.trim();if(!raw)return;let parts=raw.split(/[,،]/).map(x=>x.trim()).filter(Boolean);for(let n of parts){let exact=allIngredients().find(x=>x===n);if(!state.pantry.includes(exact||n))state.pantry.push(exact||n)}save();render();toast('انضاف الموجود عندك، وتحدّثت المشتريات.')}
 if(f.id==='locations-form'){state.town=v.get('town').trim();state.farTown=v.get('farTown').trim();save();render();toast('حُفظت مناطق البحث.')}
 if(f.id==='stock-form'){let recipe=v.get('recipe');if(!getRecipe(recipe))return;state.stock.push({id:'stock-'+Date.now(),recipe,portions:+v.get('portions'),place:v.get('place'),date:v.get('date')});save();closeModal();render();toast('وجبتك جاهزة للاقتراح في الخطة القادمة.')}
 if(f.id==='recipe-form'){let raw=v.get('ingredients').trim().split('\n').filter(x=>x.trim()),unitMap=Object.fromEntries(Object.entries(UNITS).map(([k,s])=>[s,k]));let ingredients=raw.map(row=>{let [n,q,u]=row.split('|').map(s=>s.trim());return {n,q:Number(q),u:unitMap[u]||u,g:allIngredients().includes(n)?recipes().flatMap(r=>r.ing).find(i=>i.n===n).g:'other'}});if(!ingredients.length||ingredients.some(x=>!x.n||x.n.length>99||!Number.isFinite(x.q)||x.q<=0||!UNITS[x.u])){$('#form-error').textContent='راجعي المكونات: الاسم | رقم موجب | وحدة من القائمة. مثال: رز | 300 | غ';return}let tags=v.getAll('tag');state.custom.push({id:'custom-'+Date.now(),name:v.get('name').trim(),cat:v.get('cat'),time:+v.get('time'),ing:ingredients,steps:v.get('steps').trim().split('\n').filter(s=>s.trim()),tags,art:'rice',freezer:v.get('freezer')==='on'});save();closeModal();showPage('recipes');toast('انضافت وصفتك إلى المطبخ!')}
 if(f.id==='reminder-form'){state.reminder=v.get('reminder')==='on';state.reminderTime=v.get('reminderTime');save();closeModal();toast('حُفظ وقت تذكيرك داخل التطبيق.')}
});

document.addEventListener('dragstart',e=>{
 const source=e.target.closest('[data-drag-meal]');if(!source)return;
 const token=source.dataset.dragMeal,entry=entryFromToken(token);if(!entry?.allowed){e.preventDefault();return}
 activeDrag=token;e.dataTransfer.effectAllowed='copy';e.dataTransfer.setData('application/x-tabkhti-meal',token);e.dataTransfer.setData('text/plain','tabkhti:'+token);
 source.classList.add('is-dragging');document.body.classList.add('meal-dragging');
});
document.addEventListener('dragover',e=>{const card=e.target.closest('[data-drop-day]');if(!card||!activeDrag)return;e.preventDefault();e.dataTransfer.dropEffect='copy';$$('.drag-over').forEach(el=>{if(el!==card)el.classList.remove('drag-over')});card.classList.add('drag-over')});
document.addEventListener('dragleave',e=>{const card=e.target.closest('[data-drop-day]');if(card&&!card.contains(e.relatedTarget))card.classList.remove('drag-over')});
document.addEventListener('drop',e=>{const card=e.target.closest('[data-drop-day]'),token=activeDrag;if(!card||!token){clearDrag();return}e.preventDefault();const transfer=e.dataTransfer.getData('application/x-tabkhti-meal');clearDrag();if(transfer&&transfer!==token)return;requestAssignment(token,+card.dataset.dropDay)});
document.addEventListener('dragend',clearDrag);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&activeDrag)clearDrag()});

$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){let r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
$('#modal').addEventListener('cancel',()=>{dialogContext=null});
window.addEventListener('hashchange',()=>showPage(location.hash.slice(1)));
function checkReminder(){if(!state.reminder)return;let now=new Date(),time=now.toTimeString().slice(0,5),key='reminded-'+iso(now);try{if(time>=state.reminderTime&&!sessionStorage.getItem(key)){sessionStorage.setItem(key,'1');toast(reminderText())}}catch(e){}}
icons();$('#today-date').textContent=new Intl.DateTimeFormat('ar',{weekday:'long',day:'numeric',month:'long'}).format(today);plan();repair();showPage(location.hash.slice(1)||'week');if(saveFailed)$('#save-label').textContent='التخزين غير متاح في هذا المتصفح';setTimeout(checkReminder,1200);setInterval(checkReminder,60000);
</script>
</body>
</html>
